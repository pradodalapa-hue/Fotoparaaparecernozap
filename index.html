<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Título que vai aparecer no WhatsApp -->
    <title>Foto do Veículo - Gold Car Wash</title> 
    
    <!-- TAGS CRÍTICAS PARA O WHATSAPP MOSTRAR A FOTO -->
    <meta property="og:title" content="Seu veículo está pronto!">
    <meta property="og:description" content="Obrigado pela preferencia.">
    <meta property="og:image" content="https://raw.githubusercontent.com/pradodalapa-hue/fotos-industrial/main/img/jdp_1790434942988_image_6a630504.jpg">
    <meta property="og:type" content="website">

    <!-- Estilo simples para deixar o botão bonito -->
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            padding: 20px;
        }
        .btn-cardapio {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
        }
        .btn-cardapio:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <h2>Seu veículo está pronto para retirada!</h2>
    <p>Clique no botão abaixo para ver o cardápio e os serviços do Gold Car Wash:</p>
    
    <!-- Botão que leva para a URL do seu app -->
    <a href="https://pradodalapa-hue.github.io/GOLD_CAR_WASHapp/" class="btn-cardapio" target="_blank">
        Acessar Cardápio / Gold Car Wash
    </a>
</body>
</html>
